name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Patterns.DDD.slnx
      - run: dotnet build Patterns.DDD.slnx -c Release --no-restore
      - run: dotnet test Patterns.DDD.slnx -c Release --no-build
